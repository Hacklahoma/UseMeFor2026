<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐝 Hacklahoma Admin - Login</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card card">
            <div class="login-header">
                <h1 class="login-title">🐝 Hacklahoma Admin</h1>
                <p class="login-subtitle">Tech Team Database Management Interface</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="adminSecret" class="form-label">Admin Secret</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="adminSecret" 
                            name="adminSecret" 
                            class="form-input" 
                            placeholder="Enter admin secret key"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="password-toggle"
                            aria-label="Toggle password visibility"
                        >
                            👁️
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    🔐 Authenticate
                </button>
            </form>
            
            <div class="login-footer mt-4">
                <div class="alert alert-info">
                    <strong>🔒 Secure Access Only</strong><br>
                    This interface is restricted to authorized Hacklahoma tech team members only.
                </div>
                
                <div class="system-status mt-3">
                    <div class="status-indicator">
                        <div class="status-dot"></div>
                        <span>System Online</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer" class="alert-container"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-message">Authenticating...</div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
    
    <script>
        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('adminSecret');
            
            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', () => {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    toggleBtn.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
                    toggleBtn.setAttribute('aria-label', 
                        type === 'password' ? 'Show password' : 'Hide password'
                    );
                });
            }
        });
    </script>
    
    <style>
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }
        
        .alert {
            position: relative;
            margin-bottom: 10px;
        }
        
        .alert-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .loading-content {
            text-align: center;
            color: var(--text-primary);
        }
        
        .loading-message {
            margin-top: 16px;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        
        .login-footer {
            text-align: center;
        }
        
        .system-status {
            display: flex;
            justify-content: center;
        }
        
        .password-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-input-wrapper .form-input {
            padding-right: 50px;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-toggle:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }
        
        .password-toggle:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-gold);
        }
    </style>
</body>
</html>
